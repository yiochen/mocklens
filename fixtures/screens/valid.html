<!-- Demonstrates: a clean, valid phone screen (header, cards, fixed bottom nav).
     Expected findings: none on all devices. -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Wallet — Home</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #f6f6f8; color: #1c1c1e; }
  .screen { padding: 16px; }
  header h1 { font-size: 22px; margin: 4px 0 12px; }
  .card { background: #fff; border-radius: 14px; padding: 14px; margin-bottom: 10px; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
  .card h2 { font-size: 15px; margin: 0 0 4px; }
  .card p { font-size: 13px; color: #666; margin: 0; line-height: 1.4; }
  .balance { font-size: 28px; font-weight: 700; color: #1c1c1e; }
  .bottom-nav { position: fixed; left: 0; right: 0; bottom: 0; height: 56px; background: #fff; border-top: 1px solid #e2e2e6; display: flex; }
  .bottom-nav span { flex: 1; display: flex; align-items: center; justify-content: center; font-size: 12px; color: #555; }
  .bottom-nav .active { color: #0a5cff; font-weight: 600; }
</style>
</head>
<body>
<div class="screen">
  <header><h1>Wallet</h1></header>
  <div class="card">
    <h2>Total balance</h2>
    <p class="balance">$2,480.20</p>
  </div>
  <div class="card">
    <h2>Recent activity</h2>
    <p>Coffee Shop — $4.50 · Grocery Store — $32.10</p>
  </div>
</div>
<nav class="bottom-nav"><span class="active">Home</span><span>Cards</span><span>More</span></nav>
</body>
</html>
