<!-- Demonstrates: intentional one-line truncation with ellipsis, annotated with
     data-mocklens-ignore="intentional truncation".
     Expected findings: clipped-text SUPPRESSED; screen passes. -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Files</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #f6f6f8; color: #1c1c1e; }
  .screen { padding: 16px; }
  h1 { font-size: 22px; margin: 4px 0 12px; }
  .row { background: #fff; border-radius: 12px; padding: 12px 14px; margin-bottom: 8px; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
  .trunc { margin: 0; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .meta { margin: 2px 0 0; font-size: 12px; color: #888; }
</style>
</head>
<body>
<div class="screen">
  <h1>Files</h1>
  <div class="row">
    <p class="trunc" data-mocklens-ignore="intentional truncation">quarterly-report-final-v2-approved-by-finance-2026.pdf</p>
    <p class="meta">2.4 MB · yesterday</p>
  </div>
  <div class="row">
    <p class="trunc" data-mocklens-ignore="intentional truncation">onboarding-flow-wireframes-with-annotations.fig</p>
    <p class="meta">18 MB · Monday</p>
  </div>
</div>
</body>
</html>
