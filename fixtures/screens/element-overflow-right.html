<!-- Demonstrates: a visible child extending off the right edge while the document
     itself cannot scroll (overflow-x: hidden on html/body). NOT annotated — this
     one is a real bug, unlike decorative-intentional.html.
     Expected findings: element-overflow-right (error), no document-overflow. -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Inbox</title>
<style>
  * { box-sizing: border-box; }
  html, body { overflow-x: hidden; }
  body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #f6f6f8; color: #1c1c1e; }
  .screen { position: relative; padding: 16px; }
  h1 { font-size: 22px; margin: 4px 0 12px; }
  .message { background: #fff; border-radius: 12px; padding: 12px 14px; margin-bottom: 10px; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
  .message h2 { font-size: 14px; margin: 0 0 2px; }
  .message p { font-size: 13px; color: #666; margin: 0; }
  .peek-card { position: absolute; top: 56px; right: -70px; width: 180px; background: #fff4d6; border: 1px solid #ecd27a; border-radius: 12px; padding: 12px; font-size: 12px; }
</style>
</head>
<body>
<div class="screen">
  <h1>Inbox</h1>
  <div class="message"><h2>Ana</h2><p>Lunch tomorrow at noon?</p></div>
  <div class="message"><h2>Billing</h2><p>Your receipt for March.</p></div>
  <div class="peek-card">A “quick tip” card positioned halfway off the screen — nobody will read this.</div>
</div>
</body>
</html>
