<!-- GoodPlate — favorites, empty state.
     Demonstrates: a zero-items visual state (CSS/emoji illustration + CTA).
     Expected: passes validation. -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>GoodPlate — Favorites</title>
<link rel="stylesheet" href="./shared.css">
<style>
  .empty {
    margin-top: 120px;
    display: flex; flex-direction: column; align-items: center; text-align: center;
  }
  .illustration {
    width: 120px; height: 120px; border-radius: 50%;
    background: linear-gradient(150deg, #ffe0b2, #ffccbc);
    display: flex; align-items: center; justify-content: center;
    font-size: 54px; margin-bottom: 20px;
  }
  .empty h2 { font-size: 18px; margin: 0 0 8px; }
  .empty p { font-size: 14px; line-height: 1.5; color: #8b7f70; margin: 0 0 22px; max-width: 260px; }
</style>
</head>
<body>
<div class="screen">
  <div class="appbar"><h1>Favorites</h1></div>
  <div class="empty">
    <div class="illustration">🍲</div>
    <h2>No favorites yet</h2>
    <p>Tap the heart on any recipe and it will wait for you here, even offline.</p>
    <a class="button" href="#">Browse recipes</a>
  </div>
</div>
</body>
</html>
