<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="mocklens:form-factor" content="phone"><meta name="mocklens:primary-device" content="iphone-14"><meta name="mocklens:target-devices" content="iphone-se,iphone-14,pixel-7"><meta name="mocklens:viewport" content="390x844">
<title>Ledgerly — One expense</title><link rel="stylesheet" href="../shared.css">
</head>
<body><main class="screen stack">
  <header class="topbar"><span class="brand">Ledgerly</span><span class="month-switch">July 21</span></header>
  <section class="task-head"><div><p class="eyebrow">Today</p><h1>One expense</h1><p class="supporting">$4.75 spent · $95.25 left today</p></div><a class="button" href="#">＋ Add expense</a></section>
  <section class="expense-list"><article class="expense-row"><span class="expense-icon">CF</span><div class="expense-body"><div class="expense-top"><h3>Harbor Coffee</h3><span class="amount">$4.75</span></div><p class="expense-meta">Dining · 8:12 AM · No note</p><div class="row-actions"><button class="text-button">Edit</button><button class="text-button danger">Delete</button></div></div></article></section>
  <section class="state-card"><h2>Keep the day accurate</h2><p>Add another purchase as it happens, or edit this item if the amount or category is wrong.</p><button class="button secondary block">Add another expense</button></section>
</main></body></html>
