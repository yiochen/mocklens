<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="mocklens:form-factor" content="phone"><meta name="mocklens:primary-device" content="iphone-14"><meta name="mocklens:target-devices" content="iphone-se,iphone-14,pixel-7"><meta name="mocklens:viewport" content="390x844"><title>Ledgerly — Edit refund</title><link rel="stylesheet" href="../shared.css"></head>
<body><main class="screen stack form-screen">
  <header class="taskbar"><button class="icon-button" aria-label="Go back">‹</button><h1>Edit refund</h1><button class="icon-button" aria-label="Refund actions">⋯</button></header>
  <div class="form-intro"><p class="support">Corner Market · refund added Jul 3 at 4:16 PM</p></div>
  <form class="form-card credit-form">
    <div class="field"><label>Transaction type</label><div class="type-switch" role="group" aria-label="Transaction type"><button class="type-option" type="button">Expense</button><button class="type-option active credit" type="button">Refund</button></div></div>
    <div class="field"><label for="edit-refund-amount">Amount</label><input id="edit-refund-amount" value="$7.51" inputmode="decimal"><span class="help">Stored as −$7.51 in totals.</span></div>
    <div class="field"><label for="edit-refund-merchant">Merchant</label><input id="edit-refund-merchant" value="Corner Market"></div>
    <div class="field"><label for="edit-refund-category">Category</label><select id="edit-refund-category"><option selected>Groceries</option><option>Dining</option><option>Transit</option></select></div>
    <div class="field-row"><div class="field"><label for="edit-refund-date">Date</label><input id="edit-refund-date" value="Jul 3, 2026"></div><div class="field"><label for="edit-refund-time">Time</label><input id="edit-refund-time" value="4:16 PM"></div></div>
    <div class="field"><label for="edit-refund-note">Note <span class="help">optional</span></label><textarea id="edit-refund-note">Linked to original purchase</textarea></div>
    <div class="form-actions"><button class="button" type="button">Save refund changes</button></div>
  </form>
</main></body></html>
