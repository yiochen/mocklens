<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="mocklens:form-factor" content="phone"><meta name="mocklens:primary-device" content="iphone-14"><meta name="mocklens:target-devices" content="iphone-se,iphone-14,pixel-7"><meta name="mocklens:viewport" content="390x844"><title>Ledgerly — Edit expense</title><link rel="stylesheet" href="./shared.css"></head>
<body><main class="screen stack form-screen">
  <header class="taskbar"><button class="icon-button" aria-label="Go back">‹</button><h1>Edit expense</h1><button class="icon-button" aria-label="Expense actions">⋯</button></header>
  <div class="form-intro"><p class="support">Corner Market · added today at 6:42 PM</p></div>
  <form class="form-card">
    <div class="field"><label>Transaction type</label><div class="type-switch" role="group" aria-label="Transaction type"><button class="type-option active" type="button">Expense</button><button class="type-option" type="button">Refund</button></div></div>
    <div class="field"><label for="amount">Amount</label><input id="amount" value="$24.86" inputmode="decimal"></div>
    <div class="field"><label for="merchant">Merchant</label><input id="merchant" value="Corner Market"></div>
    <div class="field"><label for="category">Category</label><select id="category"><option selected>Groceries</option><option>Dining</option><option>Transit</option></select></div>
    <div class="field-row"><div class="field"><label for="date">Date</label><input id="date" value="Jul 21, 2026"></div><div class="field"><label for="time">Time</label><input id="time" value="6:42 PM"></div></div>
    <div class="field"><label for="note">Note <span class="help">optional</span></label><textarea id="note" placeholder="Add a note"></textarea></div>
    <div class="form-actions"><button class="button" type="button">Save changes</button></div>
  </form>
</main></body></html>
