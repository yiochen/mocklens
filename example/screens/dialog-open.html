<!-- GoodPlate — home with a modal dialog open.
     Demonstrates: a statically visible modal over dimmed content, pure CSS.
     The background is intentionally short (no scrolling) so the dim overlay —
     a fixed, full-viewport element — is never mistaken for a bottom bar.
     Expected: passes validation. -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>GoodPlate — Delete recipe?</title>
<link rel="stylesheet" href="./shared.css">
<style>
  .search {
    background: #fff; border-radius: 12px; padding: 11px 14px;
    font-size: 14px; color: #a09384; box-shadow: 0 1px 4px rgba(60,40,20,.06);
    margin-bottom: 14px;
  }
  .recipe { display: flex; gap: 12px; align-items: center; margin-bottom: 12px; }
  .thumb {
    width: 84px; height: 84px; border-radius: 12px; flex: none;
    display: flex; align-items: center; justify-content: center; font-size: 34px;
  }
  .t1 { background: linear-gradient(135deg, #ffe0b2, #ffab91); }
  .t2 { background: linear-gradient(135deg, #c8e6c9, #80cbc4); }
  .recipe h3 { font-size: 15px; margin: 0 0 4px; }
  .recipe p { font-size: 12px; color: #8b7f70; margin: 0; }

  .overlay { position: fixed; inset: 0; background: rgba(30, 20, 10, .45); }
  .dialog {
    position: fixed; left: 32px; right: 32px; top: 50%; transform: translateY(-50%);
    background: #fff; border-radius: 20px; padding: 22px 20px;
    box-shadow: 0 12px 40px rgba(30, 20, 10, .3); text-align: center;
  }
  .dialog h2 { font-size: 17px; margin: 0 0 8px; }
  .dialog p { font-size: 14px; line-height: 1.5; color: #8b7f70; margin: 0 0 20px; }
  .dialog .actions { display: flex; gap: 10px; justify-content: center; }
</style>
</head>
<body>
<div class="screen">
  <div class="appbar"><h1>GoodPlate</h1></div>
  <div class="search">🔍&nbsp; Search recipes, ingredients…</div>
  <div class="card recipe">
    <div class="thumb t1">🍜</div>
    <div><h3>Weeknight ramen</h3><p>25 min · easy · 4.8 ★</p></div>
  </div>
  <div class="card recipe">
    <div class="thumb t2">🥗</div>
    <div><h3>Green goddess salad</h3><p>15 min · vegan · 4.6 ★</p></div>
  </div>
</div>

<div class="overlay"></div>
<div class="dialog">
  <h2>Delete “Weeknight ramen”?</h2>
  <p>This removes the recipe from your cookbook. You can add it back from the feed anytime.</p>
  <div class="actions">
    <a class="button secondary" href="#">Cancel</a>
    <a class="button" href="#">Delete</a>
  </div>
</div>
</body>
</html>
